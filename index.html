sh Conversion','62 Days','↓ 8 days'],['Active Initiatives','18','↑ 4']].map(x=>'<div class="kpi"><span>'+x[0]+'</span><b>'+x[1]+'</b><em>'+x[2]+'</em></div>').join('')+'</div><div class="panels"><section class="panel"><h3>Top Priorities</h3><div class="priority"><div><b>Critical Cash Flow Optimization</b><small>High impact on liquidity</small></div><div><b>Procurement Savings Initiative</b><small>Supplier terms and spend</small></div><div><b>Inventory Optimization</b><small>Working capital release</small></div></div></section><section class="panel"><h3>AI Executive Brief</h3><p style="font-size:9px;color:#717c87">Illustrative signal: working capital is the highest-leverage opportunity.</p>'+btn('Open Intelligence →','intel')+'</section></div>';if(v==='connect')return '<div class="w-head"><div><h1>Connect Your Business</h1><p>Read existing business systems first. BuildUp is ERP-agnostic.</p></div></div><div class="mode-row">'+['OBSERVE','RECOMMEND','ORCHESTRATE'].map(m=>'<button class="mode" data-mode="'+m+'"><strong>'+m+'</strong><span>'+(m==='OBSERVE'?'Read-only · default':m==='RECOMMEND'?'Analysis + recommendations':'Controlled write · approval required')+'</span></button>').join('')+'</div><section class="panel"><h3>Integration Hub</h3><div class="priority">'+['SAP / ERP','Accounting / Finance','CRM','HRIS','Banking / POS','Spreadsheets / Files'].map((x,i)=>'<div><b>'+x+'</b><small>'+(state.connections[i]?'Connected (demo)':'Ready · '+state.mode)+'</small></div>').join('')+'</div></section>';if(v==='health')return '<div class="w-head"><div><h1>Business Health</h1><p>Initial health signals across key business dimensions.</p></div></div><section class="panel"><div class="bars">'+[['Finance & Cash Flow',74],['Accounting & Reporting',82],['Tax & Compliance',61],['Strategy & KPI',73],['Sales & Marketing',68],['People & HR',79],['Operations',72],['Risk & Governance',81],['Technology & AI',58]].map(x=>'<div class="bar"><span>'+x[0]+'</span><b>'+x[1]+'</b><i style="backg cipline + procurement concentration</small></div><div><b>Action</b><small>Accelerate AR collection and renegotiate supplier terms</small></div></div></section><section class="panel"><h3>Decision Object</h3><div class="priority"><div><b>Decision</b><small>Renegotiate top 3 suppliers</small></div><div><b>Confidence</b><small>86% illustrative</small></div><div><b>Authority</b><small>Human Command</small></div></div></section></div>';if(v==='decisions')return '<div class="w-head"><div><h1>Human Command</h1><p>AI assists and recommends. Leadership retains final authority.</p></div></div><section class="panel"><div class="decision">'+state.decisions.map((d,i)=>'<div><b>'+d.decision+'</b><span>'+d.owner+'</span><span>'+d.confidence+'%</span><em class="pill">'+d.status+'</em></div>').join('')+'</div></section>';if(v==='score-app')return '<section class="panel" id="scoreWorkspace"><div class="w-head"><div><h1>BuildUp Health Check™</h1><p>8-dimension screening. Official scoring weights remain subject to validation.</p></div></div><div id="qarea"></div></section>';if(v==='ai-workforce')return '<div class="w-head"><div><h1>AI Workforce</h1><p>Agents share one canonical context and follow autonomy policies.</p></div></div><div class="agent-grid">'+[['Finance Agent','Cash, margin, AR/AP','Recommend'],['Procurement Agent','Spend, suppliers, negotiation','Recommend'],['Sales Agent','Pipeline, conversion, forecast','Assist'],['Operations Agent','Bottlenecks and workflow','Recommend'],['Risk Agent','Exposure and controls','Recommend'],['Strategy Agent','Scenarios and planning','Recommend']].map(x=>'<section class="panel"><span class="pill">'+x[2]+'</span><h3>'+x[0]+'</h3><p style="font-size:9px;color:#7d8791">'+x[1]+'</p></section>').join('')+'</div>';if(['transformation','workflows','finance','accounting','sales','customer','procurement','operations','people','risk','strategy','reports','experts','settings'].includes(v))return '<div class="w-head"><div><h1>'+title+'</h1><p>BuildUp workspace capability aligned to ERP-connected intelligence architecture.</p></div></div><div class="xray-grid">'+['Measure','Diagnose','Prioritize','Execute','Sustain','Learn'].map((x,i)=>'<div class="card"><span>0'+(i+1)+'</span><b>'+x+'</b><small>Illustrative workspace module</small></div>').join('')+'</div>';return feature('home')}function scoreModal(){return '<div class="modal" id="scoreModal"><div class="modal-box"><div class="qmeta">BuildUp Health Check™</div><h2 style="font-size:28px;margin:8px 0">Business Health Diagnostic</h2><div id="qm"></div></div></div>'}let qi=0,qa=[];const qs=['Finance & Cash Flow','Sales & Growth','Operations','Procurement','People','Risk','Technology & AI','Growth'];const opts=['Belum terstruktur','Masih bergantung pada individu','Sudah berjalan tetapi belum konsisten','Terstruktur dan rutin diukur'];function openScore(){qi=0;qa=[];document.getElementById('scoreModal').classList.add('open');renderQ()}function renderQ(){const q=qs[qi];document.getElementById('qm').innerHTML='<div class="qmeta">'+q+' · '+(qi+1)+'/'+qs.length+'</div><div class="qtitle">How mature is your business in this area?</div><div class="options">'+opts.map((x,i)=>'<button class="opt" data-q="'+(i+1)+'">'+x+'</button>').join('')+'</div>';document.querySelectorAll('#qm .opt').forEach(b=>b.onclick=()=>{qa.push(Number(b.dataset.q));if(qi<qs.length-1){qi++;renderQ()}else finishScore()})}function finishScore(){state.score=Math.round(qa.reduce((a,b)=>a+b,0)/(qs.length*4)*100);save();document.getElementById('qm').innerHTML='<div class="result"><div class="qmeta">Initial Business Health Snapshot</div><div class="result-number">'+state.score+'</div><p style="font-size:9px;color:#6f7984">Your directional result is stored locally in this demo. A production result should be persisted to the BuildUp tenant after validation.</p>'+btn('Open Client Workspace','home','gold')+' '+btn('Close','close')+'</div>';document.querySelectorAll('[data-go="home"]').forEach(b=>b.onclick=()=>{document.getElementById('scoreModal').classList.remove('open');goto('home')});document.querySelector('[data-go="close"]').onclick=()=>document.getElementById('scoreModal').classList.remove('open')}function bind(){document.querySelectorAll('[data-go]').forEach(b=>{b.onclick=()=>{const a=b.dataset.go;if(a==='close'){document.getElementById('scoreModal')?.classList.remove('open');return}if(a==='score-app'){openScore();return}goto(a)}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();render()});if(location.hash==='#unlock-xray'){state.xray=true;save();goto('xray');}if(document.querySelector('[data-go="unlock-xray"]'))document.querySelector('[data-go="unlock-xray"]').onclick=()=>{state.xray=true;save();goto('xray');};if(document.querySelector('[data-go="gen"]'))document.querySelector('[data-go="gen"]').onclick=()=>alert('Demo insight generated. Production inference will use validated connected data.')}function render(){const h=(location.hash||'#home').replace('#','');const publicHashes=['home','method','score','context','xray','intel','os','workforce','connect','contact'];if(publicHashes.includes(h)||h==='')root.innerHTML=marketing();else root.innerHTML=workspace(h);bind();if(h==='score-app'&&!document.getElementById('scoreModal')){root.insertAdjacentHTML('beforeend',scoreModal());openScore()}if(h==='score-app'&&!document.getElementById('qarea')){}if(h==='score-app'){const area=document.getElementById('qarea');if(area)area.innerHTML='<p style="font-size:9px;color:#7b8590">Use the top navigation to start the Health Check assessment.</p>'+btn('Start Assessment →','score-app','gold');document.querySelector('[data-go="score-app"]')?.addEventListener('click',openScore)}}window.addEventListener('hashchange',render);render();</script></body></html>
