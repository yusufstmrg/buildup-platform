 you need a deeper Business X-Ray™ or 360 assessment.</p><div class='features'><div><b>Quick to start</b><span>Low-friction screening for owners and leadership teams.</span></div><div><b>Action-oriented</b><span>Priorities, not just a score.</span></div><div><b>Designed to unlock X-Ray</b><span>Move from signals to root cause, leakage, risk and 90-day priorities.</span></div></div>${btn('Start Health Check™ →','score-app','gold')}</div></div></section><section class='context'><div class='container'><div class='section-title'><div><div class='eyebrow'>Business Context Graph</div><h2>Understand relationships, not just rows.</h2></div><p>Canonical business entities connect Customer → Sales → Revenue → Inventory → Supplier → Cash → Profit.</p></div><div class='graph'><div class='lines'></div><div class='node center'>BUSINESS CONTEXT</div><div class='node n1'>Customer</div><div class='node n2'>Sales Order</div><div class='node n3'>Revenue</div><div class='node n4'>Inventory</div><div class='node n5'>Supplier</div><div class='node n6'>Cash</div><div class='node n7'>Profit</div></div></div></section><section id='xray'><div class='container'><div class='section-title'><div><div class='eyebrow'>BuildUp Business X-Ray™</div><h2>From signals to root cause.</h2></div><p>Paid diagnostic: evidence + expert synthesis to expose bottlenecks, value leakage, risk, opportunities and a prioritized 90-day roadmap.</p></div><div class='xray-grid'>${[['Business Health','Overall score + dimension view'],['Critical Bottlenecks','What is limiting performance'],['Value Leakage','Where margin, cash, time or productivity leaks'],['Risk Map','Operational, financial, compliance and strategic risk'],['Growth Opportunities','Evidence-based upside / downside'],['90-Day Roadmap','Owner + KPI + sequence']].map(x=>`<div class='card'><span>${x[0]}</span><b>${x[1]}</b><small>Evidence + context + decision support</small></div>`).join('')}</div><div class='actions'>${btn('Explore Business X-Ray™','xray-app','gold')}</div></div></section><section class='dark' id='intel'><div class='container'><div class='section-title'><div><div class='eyebrow'>BuildUp Intelligence™</div><h2>What happened? Why? What matters? What next?</h2></div><p style='color:#9ba6b2'>Decision intelligence turns connected context into insight, scenarios, recommendation and decision records.</p></div><div class='insights'>${[['WHAT HAPPENED?','Gross margin declined 4.8%','Illustrative signal'],['WHY?','Supplier + inventory pressure','Root-cause framing'],['WHAT MATTERS?','Cash conversion is tightening','Economic impact'],['WHAT NEXT?','AR + supplier actions','Priority recommendation'],['HUMAN COMMAND','AI recommends. Humans decide.','Governance']].map(x=>`<div class='insight'><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><div class='actions'>${btn('Open Intelligence™ →','intel','gold')}</div></div></section><section id='os'><div class='container'><div class='section-title'><div><div class='eyebrow'>BuildUp Business OS™</div><h2>The operating layer above your existing systems.</h2></div><p>Workflows, approvals, monitoring and execution gates without forcing an ERP replacement.</p></div><div class='os-grid'>${[['01','Command Center','Executive health, priorities, risk, decisions.'],['02','Score & X-Ray','From diagnostic to continuous health.'],['03','Transformation','Initiatives, owners, milestones and benefits.'],['04','AI Workforce','Finance, procurement, sales, operations, risk, strategy.'],['05','Human Command','Permissions, approvals, audit trails and rollback.']].map(x=>`<div class='os-tile'><span>${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div></section><section class='trust' id='workforce'><div class='container trust-grid'><div><div class='eyebrow'>Human Command</div><h2>AI works with humans, not instead of them.</h2></div><div class='trust-items'><div><b>Evidence-based</b><span>Recommendations tied to source context.</span></div><div><b>Governed</b><span>Autonomy rises only within policy.</span></div><div><b>Outcome-oriented</b><span>Every initiative has measurable outcomes.</span></div><div><b>Human accountable</b><span>Material decisions remain under human authority.</span></div></div></div></section><section class='cta'><div class='container cta-box'><div><div class='eyebrow'>Start the journey</div><h2>Understand before you transform.</h2><p style='color:#aeb9c5'>Begin with a Business Health Check™ and let the data determine the right next step.</p></div><div class='actions'>${btn('Take Health Check™ →','score-app','gold')}${btn('Open Platform','home','outline')}</div></div></section></main><footer class='footer'><div class='container footer-grid'><div><div class='brand'>Build<b>Up</b></div><p>Business Transformation Partner.<br><b>Build Better Businesses. Build Businesses That Last.</b></p></div><div><h4>Solutions</h4><a href='#score'>Health Check™</a><a href='#xray'>Business X-Ray™</a><a href='#intel'>Intelligence™</a><a href='#os'>Business OS™</a></div><div><h4>Company</h4><a href='#method'>Method™</a><a href='#workforce'>AI Workforce</a></div><div><h4>Trust</h4><a href='#intel'>Human Command</a><span>© 2026 BuildUp</span></div></div></footer>${scoreModal()}</div>`}function side(){return `<aside class='sidebar'><div class='brand'>Build<b>Up</b></div><div style='font-size:7px;letter-spacing:.16em;color:#d7b665;margin:5px 8px 17px'>BUSINESS TRANSFORMATION PARTNER</div><div class='tenant'>PT Cemerlang Abadi<small>Demo tenant · Owner</small></div><nav class='snav'>${NAV.map(x=>`<a class='${location.hash.replace('#','')===x[1]?'active':''}' href='#${x[1]}'>${x[0]}</a>`).join('')}</nav><div style='margin-top:18px;color:#66727f;font-size:7px'>● Demo mode</div></aside>`}function workspace(v){const title=NAV.find(x=>x[1]===v)?.[0]||'Command Center';let body='';if(v==='home')body=`<div class='w-head'><div><h1>Command Center</h1><p>Executive view across health, priorities, intelligence and transformation.</p></div>${btn('+ New Insight','intel','gold')}</div><div class='kpis'>${[['Business Health',state.score+'/100','↑ 6 pts'],['Revenue YTD','Rp 24.8 M','↑ 12.5%'],['EBITDA Margin','11.3%','↓ 1.2%'],['Cash Conversion','62 Days','↓ 8 days'],['Active Initiatives','18','↑ 4']].map(x=>`<div class='kpi'><span>${x[0]}</span><b>${x[1]}</b><em>${x[2]}</em></div>`).join('')}</div><div class='panels'><section class='panel'><h3>Top Priorities</h3><div class='priority'><div><b>Critical Cash Flow Optimization</b><small>High impact on liquidity</small></div><div><b>Procurement Savings Initiative</b><small>Supplier terms and spend</small></div><div><b>Inventory Optimization</b><small>Working capital release</small></div></div></section><section class='panel'><h3>AI Executive Brief</h3><p style='font-size:9px;color:#717c87'>Illustrative signal: working capital is the highest-leverage opportunity.</p>${btn('Open Intelligence →','intel')}</section></div>`;else if(v==='connect-app')body=`<div class='w-head'><div><h1>Connect Your Business</h1><p>Connect existing systems without replacing them. Read-only by default.</p></div></div><div class='mode-row'>${['OBSERVE','RECOMMEND','ORCHESTRATE'].map(m=>`<button class='mode' data-mode='${m}'><strong>${m}</strong><span>${m==='OBSERVE'?'Read-only · default':m==='RECOMMEND'?'Analysis + recommendations':'Controlled write · approval required'}</span></button>`).join('')}</div><section class='panel'><h3>Integration Hub</h3><div class='priority'>${['SAP / ERP','Accounting / Finance','CRM','HRIS','Banking / POS','Spreadsheets / Files'].map((x,i)=>`<div><b>${x}</b><small>${state.connected?'Connected (demo)':i===5?'Ready · file ingestion':'Ready · '+state.mode}</small></div>`).join('')}</div>${btn(state.connected?'Refresh demo connections':'Connect demo stack','connect-demo','gold')}</section>`;else if(v==='health')body=`<div class='w-head'><div><h1>Business Health</h1><p>Initial health signals across key business dimensions.</p></div></div><section class='panel'><div class='bars'>${[['Finance & Cash Flow',74],['Accounting & Reporting',82],['Tax & Compliance',61],['Strategy & KPI',73],['Sales & Marketing',68],['People & HR',79],['Operations',72],['Risk & Governance',81],['Technology & AI',58]].map(x=>`<div class='bar'><span>${x[0]}</span><b>${x[1]}</b><i style='background:#edf1f5'><u style='width:${x[1]}%'></u></i></div>`).join('')}</div>${btn('Start / Refresh Health Check™','score-app','gold')}</section>`;else if(v==='xray')body=`<div class='w-head'><div><h1>Business X-Ray™</h1><p>Root-cause diagnostic with evidence and cross-functional context.</p></div></div><section class='panel'>${state.xray?`<h3>Root-cause map ready</h3><div class='xray-grid'>${[['Working Capital','Margin leakage'],['Procurement','Supplier concentration'],['Sales Effectiveness','Pipeline conversion'],['People Capacity','Capacity bottleneck'],['Risk & Controls','Control gap'],['Technology','Automation opportunity']].map(x=>`<div class='card'><span>${x[0]}</span><b>${x[1]}</b><small>Illustrative finding</small></div>`).join('')}</div>`:`<h3>Move from signals to root cause.</h3><p>The paid diagnostic layer is gated in this MVP.</p>${btn('Unlock X-Ray (demo)','unlock-xray','gold')}</section>`}`;else if(v==='context')body=`<div class='w-head'><div><h1>Business Context Graph</h1><p>Canonical entities + economic relationships.</p></div></div><div class='graph'><div class='lines'></div><div class='node center'>BUSINESS</div><div class='node n1'>Customer</div><div class='node n2'>Sales</div><div class='node n3'>Revenue</div><div class='node n4'>Inventory</div><div class='node n5'>Supplier</div><div class='node n6'>Cash</div><div class='node n7'>Profit</div></div>`;else if(v==='intel')body=`<div class='w-head'><div><h1>Executive X-Ray</h1><p>Evidence + context + scenarios + confidence + recommendation.</p></div>${btn('Generate Insight','gen','gold')}</div><div class='panels'><section class='panel'><h3>What should leadership know right now?</h3><p style='font-size:10px'>Working capital is the highest-leverage illustrative opportunity.</p><div class='priority'><div><b>Evidence</b><small>AR days +11% · top 3 suppliers = 54% spend</small></div><div><b>Root cause</b><small>Collection discipline + procurement concentration</small></div><div><b>Action</b><small>Accelerate AR collection and renegotiate supplier terms</small></div></div></section><section class='panel'><h3>Decision Object</h3><div class='priority'><div><b>Decision</b><small>Renegotiate top 3 suppliers</small></div><div><b>Confidence</b><small>86% illustrative</small></div><div><b>Authority</b><small>Human Command</small></div></div></section></div>`;else if(v==='decisions')body=`<div class='w-head'><div><h1>Human Command</h1><p>AI assists and recommends. Leadership retains final authority.</p></div></div><section class='panel'><div class='decision'>${state.decisions.map(d=>`<div><b>${d.decision}</b><span>${d.owner}</span><span>${d.confidence}%</span><em class='pill'>${d.status}</em></div>`).join('')}</div></section>`;else if(v==='score-app')body=`<section class='panel'><div class='w-head'><div><h1>BuildUp Health Check™</h1><p>8-dimension screening. Official scoring weights remain subject to validation.</p></div></div>${btn('Start Assessment →','open-score','gold')}</section>`;else if(v==='ai-workforce')body=`<div class='w-head'><div><h1>AI Workforce</h1><p>Agents share one canonical business context and follow autonomy policies.</p></div></div><div class='agent-grid'>${[['Finance Agent','Cash, margin, AR/AP','Recommend'],['Procurement Agent','Spend, suppliers, negotiation','Recommend'],['Sales Agent','Pipeline, conversion, forecast','Assist'],['Operations Agent','Bottlenecks and workflow','Recommend'],['Risk Agent','Exposure and controls','Recommend'],['Strategy Agent','Scenarios and planning','Recommend']].map(x=>`<section class='panel'><span class='pill'>${x[2]}</span><h3>${x[0]}</h3><p style='font-size:9px;color:#7d8791'>${x[1]}</p></section>`).join('')}</div>`;else body=`<div class='w-head'><div><h1>${title}</h1><p>BuildUp workspace capability aligned to ERP-connected intelligence architecture.</p></div></div><div class='xray-grid'>${['Measure','Diagnose','Prioritize','Execute','Sustain','Learn'].map((x,i)=>`<div class='card'><span>0${i+1}</span><b>${x}</b><small>Illustrative workspace module</small></div>`).join('')}</div>`;return `<div class='workspace'>${side()}<section class='wmain'><header class='wtop'><div class='wtitle'>${title}</div><div>${btn('Public site','home')}</div></header><div class='wcontent'>${body}</div></section></div>`}function scoreModal(){return `<div class='modal' id='scoreModal'><div class='modal-box'><div class='qmeta'>BuildUp Health Check™</div><h2>Business Health Diagnostic</h2><div id='qm'></div></div></div>`}let qi=0;let qa=[];const qs=['Finance & Cash Flow','Sales & Growth','Operations','Procurement','People','Risk','Technology & AI','Growth'];const opts=['Belum terstruktur','Masih bergantung pada individu','Sudah berjalan tetapi belum konsisten','Terstruktur dan rutin diukur'];function openScore(){qi=0;qa=[];document.getElementById('scoreModal')?.remove();document.body.insertAdjacentHTML('beforeend',scoreModal());document.getElementById('scoreModal').classList.add('open');renderQ()}function renderQ(){const q=qs[qi];const qm=document.getElementById('qm');qm.innerHTML=`<div class='qmeta'>${q} · ${qi+1}/${qs.length}</div><div class='qtitle'>Seberapa matang bisnis Anda pada area ini?</div><div class='options'>${opts.map((x,i)=>`<button class='opt' data-q='${i+1}'>${x}</button>`).join('')}</div>`;qm.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{qa.push(Number(b.dataset.q));if(qi<qs.length-1){qi++;renderQ()}else finishScore()})}function finishScore(){state.score=Math.round(qa.reduce((a,b)=>a+b,0)/(qs.length*4)*100);save();document.getElementById('qm').innerHTML=`<div class='result'><div class='qmeta'>Initial Business Health Snapshot</div><div class='result-number'>${state.score}</div><p style='font-size:9px;color:#6f7984'>Directional MVP result. Production scoring should be validated on real businesses.</p><div class='result-priority'>${qs.slice(0,4).map((x,i)=>`<div><span>${i+1} · ${x}</span><b>${qa[i]}/4</b></div>`).join('')}</div><div class='actions'>${btn('Explore Business X-Ray™','xray','gold')}${btn('Close','close')}</div></div>`;document.querySelector('[data-go=close]').onclick=()=>document.getElementById('scoreModal')?.remove();document.querySelector('[data-go=xray]')?.addEventListener('click',()=>{document.getElementById('scoreModal')?.remove();goto('xray')})}function goto(h){location.hash=h}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const a=b.dataset.go;if(a==='open-score'||a==='score-app'){openScore();return}if(a==='close'){document.getElementById('scoreModal')?.remove();return}if(a==='connect-demo'){state.connected=true;save();render();return}if(a==='unlock-xray'){state.xray=true;save();render();return}if(a==='gen'){alert('Demo insight generated. Production inference will use validated connected data.');return}goto(a)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();render()})}function render(){const h=(location.hash||'#home').replace('#','');if(['home','method','score','context','xray','intel','os','workforce','connect'].includes(h)||h==='')app.innerHTML=marketing();else app.innerHTML=workspace(h);bind()}window.addEventListener('hashchange',render);render();</script></body></html>
