eight:900;font-size:10px;margin-top:4px}.bar-stack{display:grid;gap:9px;margin-top:18px}.bar-stack label{display:flex;justify-content:space-between;font-size:8px;color:#707984}.bar-stack i,.metric-row i,.bar-item i{display:block;height:6px;background:#edf1f5;border-radius:999px;overflow:hidden;margin-top:4px}.bar-stack u,.metric-row u,.bar-item u{display:block;height:100%;background:linear-gradient(90deg,#d9a441,#efc96d);border-radius:999px;text-decoration:none}.radar-wrap{display:grid;place-items:center;align-content:center}.radar-wrap svg{max-width:220px;width:100%}.radar-wrap span{font-size:8px;color:#9aa2ad}.radar-grid{fill:none;stroke:#d9e0e8;stroke-width:1}.radar-value{fill:rgba(217,164,65,.14);stroke:#d7a948;stroke-width:3}.priority-stack{display:grid;gap:8px}.priority-row{padding:11px 12px;border:1px solid var(--line);border-radius:12px}.priority-row b{font-size:10px}.priority-row p{font-size:8px;color:#7c8792;margin:5px 0 0;max-width:90%}.priority-tag{float:right;font-size:7px;font-weight:900;padding:4px 6px;border-radius:999px}.critical{color:#c44a42;background:#fff0ee}.high{color:#a36a0a;background:#fff8e7}.medium{color:#5076a4;background:#edf5ff}.link-button{border:none;background:none;color:#a4771d;font-size:9px;font-weight:900;padding:0}.chart{height:210px}.chart svg{width:100%;height:100%}.chart-grid{stroke:#edf1f5;stroke-width:1}.chart-line{fill:none;stroke:#d7a847;stroke-width:3}.chart-labels{display:flex;justify-content:space-between;color:#9aa3ad;font-size:8px}.ai-brief strong{font-size:12px}.ai-brief p{color:#69737e;font-size:9px}.ai-brief b{font-size:9px;color:#a4771d}.decision-feed{display:grid;gap:12px}.decision-feed>div{display:grid;grid-template-columns:10px 1fr;gap:8px}.decision-feed b{font-size:9px}.decision-feed p{font-size:8px;color:#87909a;margin:4px 0 0}.decision-dot{width:7px;height:7px;border-radius:50%;margin-top:3px;background:#7bbd9c;box-shadow:0 0 0 4px rgba(66,184,131,.08)}.decision-dot.warn{background:#d6a343}.decision-dot.attention{background:#de6a60}.workspace-callout{margin-top:10px;border:1px solid rgba(217,164,65,.24);border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(140deg,#09192b,#0c2239);color:#fff}.workspace-callout h2{font:800 22px/1.1 Manrope;margin:6px 0}.workspace-callout p{font-size:9px;color:#aab5c1;margin:0}.workspace-callout .eyebrow{color:#efc56c}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>\nconst root = document.getElementById('app');

const SUPABASE_URL = 'https://bkigjpuszouqhryvtwmf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_5ROUJLeQU_shvC-kNdsW0g_TslaxWDo';
const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
let currentSession = null;
let lastAssessmentId = null;

async function syncAuth(){
  if(!supabaseClient) return;
  try{
    const {data}=await supabaseClient.auth.getSession();
    currentSession=data?.session||null;
  }catch(e){console.warn('BuildUp auth bootstrap failed',e)}
}

async function persistPublicHealthCheck(answers,result,priorities){
  if(!supabaseClient) return null;
  const assessmentId = crypto.randomUUID();
  const assessment = {
    id: assessmentId,
    organization_id: null,
    status: 'completed',
    scoring_version: 'health-check-provisional-v2',
    overall_score: result,
    dimension_scores: Object.fromEntries(QUESTIONS.map((q,i)=>[q[0],Math.round((answers[i]/4)*100)])),
    priority_areas: priorities,
    source: 'web',
    completed_at: new Date().toISOString()
  };
  const {error:assessmentError}=await supabaseClient.from('score_assessments').insert(assessment);
  if(assessmentError){console.warn('Health Check persistence failed',assessmentError);return null;}
  const rows=QUESTIONS.map((q,i)=>({assessment_id:assessmentId,dimension:q[0],question_key:`health_check_${i+1}`,answer_value:{value:answers[i],label:OPTIONS[answers[i]-1]},evidence_refs:[]}));
  const {error:answersError}=await supabaseClient.from('score_answers').insert(rows);
  if(answersError){console.warn('Health Check answers persistence failed',answersError);}
  lastAssessmentId=assessmentId;
  eventPush('health_check_completed',{assessment_id:assessmentId,score:result});
  return assessmentId;
}

async function submitLead(lead){
  if(!supabaseClient) return {error:new Error('Supabase client unavailable')};
  const payload={...lead,assessment_id:lastAssessmentId||null,source:'web'};
  return await supabaseClient.from('lead_intakes').insert(payload);
}

let qIndex=0; let qAnswers=[];
function renderScoreModal(){
  document.getElementById('scoreResult')?.classList.add('hidden');
  const q=QUESTIONS[qIndex];
  document.getElementById('scoreProgress').style.width=((qIndex+1)/QUESTIONS.length*100)+'%';
  document.getElementById('scoreQuestion').innerHTML=`<div class="question-label">${q[0]} · ${qIndex+1}/${QUESTIONS.length}</div><h3 class="question-title">${q[1]}</h3><div class="option-list">${OPTIONS.map((x,i)=>`<button class="option" data-answer="${i+1}">${x}</button>`).join('')}</div>`;
  document.querySelectorAll('#scoreQuestion .option').forEach(btn=>btn.onclick=()=>{qAnswers.push(Number(btn.dataset.answer)); if(qIndex<QUESTIONS.length-1){qIndex++;renderScoreModal();}else finishScoreModal();});
}
async function finishScoreModal(){
  const result=Math.round(qAnswers.reduce((a,b)=>a+b,0)/(QUESTIONS.length*4)*100);
  state.score=result;
  state.priorities=QUESTIONS
    .map((q,i)=>({name:q[0],level:qAnswers[i]<=1?'Priority':qAnswers[i]===2?'Watch':'Opportunity',note:`Screening result ${qAnswers[i]}/4`}))
    .sort((a,b)=>a.level==='Priority'?-1:b.level==='Priority'?1:a.level.localeCompare(b.level))
    .slice(0,4);
  saveState();
  const assessmentPromise=persistPublicHealthCheck(qAnswers,result,state.priorities);
  document.getElementById('scoreQuestion').innerHTML='';
  document.getElementById('scoreModalIntro').classList.add('hidden');
  document.getElementById('scoreResult').classList.remove('hidden');
  document.getElementById('scoreResult').innerHTML=`<div class="result-kicker">Initial Business Health Snapshot</div><div class="result-number">${result}</div><p>Your Health Check result has been saved. Unlock a structured Business X-Ray™ conversation by leaving your details below.</p><div class="result-priority">${state.priorities.map((x,j)=>`<div><span>${j+1} · ${esc(x.name)}</span><b>${esc(x.level)}</b></div>`).join('')}</div><div class="lead-capture"><div class="lead-capture-title">Unlock Business X-Ray™</div><div class="lead-grid"><input id="leadName" placeholder="Nama *"/><input id="leadCompany" placeholder="Perusahaan *"/><input id="leadEmail" placeholder="Email *" type="email"/><input id="leadPhone" placeholder="WhatsApp"/><select id="leadRole"><option value="">Role</option><option>Founder / Owner</option><option>CEO / Director</option><option>CFO / Finance</option><option>HR / People</option><option>Operations</option><option>Management</option></select><select id="leadBusinessType"><option value="">Business type</option><option>UMKM</option><option>PT Perorangan</option><option>CV</option><option>PT</option><option>Other</option></select></div><textarea id="leadChallenge" placeholder="Apa tantangan bisnis terbesar Anda?" maxlength="2000"></textarea><div id="leadMsg" class="micro"></div><button class="btn btn-gold" data-submit-lead>Request Business X-Ray™ →</button></div><div class="modal-actions"><button class="btn btn-outline" data-close-score>Close</button></div>`;
  await assessmentPromise;
  document.querySelectorAll('[data-close-score]').forEach(x=>x.onclick=()=>closeModal('scoreModal'));
  document.querySelector('[data-submit-lead]')?.addEventListener('click',async()=>{
    const name=document.getElementById('leadName')?.value.trim();
    const company=document.getElementById('leadCompany')?.value.trim();
    const email=document.getElementById('leadEmail')?.value.trim();
    const msg=document.getElementById('leadMsg');
    if(!name||!company||!email){msg.textContent='Nama, perusahaan, dan email wajib diisi.';return;}
    const btn=document.querySelector('[data-submit-lead]');btn.disabled=true;msg.textContent='Saving…';
    const {error}=await submitLead({name,email,company,role:document.getElementById('leadRole')?.value||null,business_type:document.getElementById('leadBusinessType')?.value||null,phone:document.getElementById('leadPhone')?.value.trim()||null,challenge:document.getElementById('leadChallenge')?.value.trim()||null});
    if(error){msg.textContent='Belum tersimpan. Silakan coba lagi.';btn.disabled=false;return;}
    msg.textContent='Terkirim. BuildUp dapat melanjutkan ke proses Business X-Ray™.';eventPush('xray_lead_submitted',{assessment_id:lastAssessmentId});
    btn.textContent='Request received ✓';
  });
}

function bindScoreWorkspace(){
  let i=0;

  const renderQuestion=()=>{
    const q=QUESTIONS[i];
    document.getElementById('assessmentCount').textContent=`Question ${i+1} of ${QUESTIONS.length}`;
    document.getElementById('assessmentProgress').style.width=((i+1)/QUESTIONS.length*100)+'%';

    body.querySelectorAll('.option').forEach(btn=>{
      btn.onclick=()=>{
        answers.push(Number(btn.dataset.answer));
        if(i<QUESTIONS.length-1){
          i++;
          renderQuestion();
          return;
        }
        const result=Math.round(answers.reduce((a,b)=>a+b,0)/(QUESTIONS.length*4)*100);
        state.score=result;
        state.priorities=QUESTIONS
          .map((q,idx)=>({name:q[0],level:answers[idx]<=1?'Priority':answers[idx]===2?'Watch':'Opportunity',note:`Screening result ${answers[idx]}/4`}))
          .sort((a,b)=>a.level==='Priority'?-1:b.level==='Priority'?1:a.level.localeCompare(b.level))
          .slice(0,4);
        saveState();
        body.innerHTML=`<div class="result-screen"><div class="result-kicker">Initial Business Health Snapshot</div><div class="result-number">${result}</div><p>Your screening result is saved in this browser demo.</p><div class="result-priority">${state.priorities.map((x,j)=>`<div><span>${j+1} · ${esc(x.name)}</span><b>${esc(x.level)}</b></div>`).join('')}</div><div class="modal-actions"><button class="btn btn-gold" data-back-dashboard>Back to Command Center</button><button class="btn btn-outline" data-open-workspace>Open Business OS</button></div></div>`;
        body.querySelector('[data-back-dashboard]')?.addEventListener('click',()=>go('home'));
        body.querySelector('[data-open-workspace]')?.addEventListener('click',()=>go('health'));
      };
    });
  };
  renderQuestion();
}

function render(){
  document.body.style.overflow='';
  const hash=(location.hash||'#home').replace(/^#/,'');
  if(hash==='home'||hash===''||['solutions','method','score','intelligence','os','resources','about','trust','connect-app','health-check-app','xray-app','ai-workforce-app'].includes(hash)){root.innerHTML=home();bindMarketing();refreshPublicScore();return;}
  platformRoute(hash);
}
function bindMarketing(){
  document.querySelectorAll('[data-open-score]').forEach(b=>b.onclick=startScore);
  document.querySelectorAll('[data-open-workspace]').forEach(b=>b.onclick=()=>go('home'));
  document.querySelectorAll('[data-open-connect]').forEach(b=>b.onclick=()=>go('connect-app'));
  document.querySelectorAll('[data-open-xray]').forEach(b=>b.onclick=()=>go('xray-app'));
  document.querySelectorAll('[data-open-intel]').forEach(b=>b.onclick=()=>go('intel'));
  document.querySelectorAll('[data-open-intel]').forEach(b=>b.onclick=()=>go('intel')); 
  document.querySelectorAll('[data-toggle-mobile]').forEach(b=>b.onclick=()=>document.querySelector('.marketing-links')?.classList.toggle('open'));
  document.querySelectorAll('.marketing-links a').forEach(a=>a.onclick=()=>document.querySelector('.marketing-links')?.classList.remove('open'));
  document.querySelectorAll('[data-close-score]').forEach(b=>b.onclick=()=>closeModal('scoreModal'));
  document.getElementById('scoreModal')?.addEventListener('click',e=>{if(e.target.id==='scoreModal')closeModal('scoreModal')});
}
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',async()=>{await syncAuth();render();});
